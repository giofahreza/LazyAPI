# LazyAPI's default Neovim-style workspace. All bindings below are configurable.
[keybindings.workspace]
focus_left = "Ctrl-h"
focus_down = "Ctrl-j"
focus_up = "Ctrl-k"
focus_right = "Ctrl-l"
previous_request = "["
next_request = "]"
close_request = "Shift-X"
previous_panel = "Shift-BackTab"
page_up = "Ctrl-u"
page_down = "Ctrl-d"

[keybindings.main_menu]
exit = "q"
expand_collection = "l"
unselect_request = "h"
move_request_up = "Shift-K"
move_request_down = "Shift-J"
next_environment = "e"
display_env_editor = "Ctrl-e"
display_cookies = "c"
display_logs = "Shift-L"

[keybindings.generic]
display_help = "?"

[keybindings.generic.text_input]
# Vim: Esc/Ctrl+[ keeps the editor open in Normal; Enter on a value opens Normal.
# i/a/I/A enters Insert. :w saves; :wq finishes; :q! discards. F1 opens help.
quit_without_saving = "Ctrl-c"
save_and_quit_single_line = "Enter"
save_and_quit_area = "Ctrl-s"
mode = "vim"

[keybindings.generic.navigation]
move_cursor_up = "k"
move_cursor_down = "j"
move_cursor_left = "h"
move_cursor_right = "l"
alt_move_cursor_up = "Up"
alt_move_cursor_down = "Down"
alt_move_cursor_left = "Left"
alt_move_cursor_right = "Right"
go_back = "Esc"
select = "Enter"

[keybindings.generic.list_and_table_actions]
create_element = "a"
delete_element = "d"
edit_element = "i"
rename_element = "r"
toggle_element = "t"
duplicate_element = "Shift-Y"

[keybindings.request_selected]
param_next_tab = "Tab"
change_url = "u"
change_method = "m"
request_settings = "s"
export_request = "Shift-E"
next_view = "v"
send_request = "Space"
alt_send_request = "Ctrl-Enter"

[keybindings.request_selected.param_tabs]
change_auth_method = "Ctrl-a"
change_body_content_type = "Ctrl-b"
change_message_type = "Ctrl-t"

[keybindings.request_selected.result_tabs]
scroll_up = "k"
scroll_down = "j"
scroll_left = "h"
scroll_right = "l"
yank_response_part = "y"
# Legacy alias; Tab / Shift+Tab navigate the focused pane's panels.
result_next_tab = "Shift-BackTab"
