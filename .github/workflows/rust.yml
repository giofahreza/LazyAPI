name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --locked --verbose
    - name: Verify CLI and collection storage
      run: LAZYAPI_BIN=target/debug/lazyapi python3 -m unittest discover -s tests -v
